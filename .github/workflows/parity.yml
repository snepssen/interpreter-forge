# The Interpreter's three implementations held to the same cases (cases/):
# Python, the reference; Swift, the iPhone and Mac apps' InterpreterCore; and
# Kotlin, the Android app's core. A case added there is asked of all three.
name: parity

on:
  push:
    paths: ["cases/**", "src/**", "tests/**", "apple/Sources/InterpreterCore/**", "apple/Sources/tccheck/**",
            "android/core/**", "android/gradle/**", ".github/workflows/parity.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    # macOS: translate_core imports mlx-lm, which has no Linux build.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen pytest -q tests/test_segmenter.py tests/test_clock.py tests/test_echoes.py tests/test_gate.py tests/test_catch_up.py

  swift:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v4
      - run: swift run -q tccheck

  kotlin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew :core:test --no-daemon
