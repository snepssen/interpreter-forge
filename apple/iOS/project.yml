# The iPhone and iPad app. `xcodegen` turns this into Interpreter.xcodeproj
# (not kept in git); build-ios.sh does that, stages the bundled data, builds
# and installs. A phone stays upright; an iPad turns every way and shares its
# screen (Split View, Stage Manager), so the layout follows the window's width.
name: Interpreter
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  InterpreterPackage:
    path: ..
schemes:
  InterpreterPhone:
    build:
      targets:
        Interpreter: all
targets:
  Interpreter:
    type: application
    platform: iOS
    sources:
      - path: App  # Assets.xcassets holds the icon, from scripts/make-icon.py
      - path: Resources/snepssen-polyglot.onnx
        buildPhase: resources
      - path: Resources/snepssen-polyglot.onnx.json
        buildPhase: resources
      - path: Resources/silero_vad.onnx
        buildPhase: resources
    dependencies:
      - package: InterpreterPackage
        product: InterpreterUI
      - package: InterpreterPackage
        product: InterpreterEngine
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Interpreter
        NSMicrophoneUsageDescription: Interpreter listens to the conversation around you to translate it into your language, on this device.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
                                                UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snepssen.interpreter
        DEVELOPMENT_TEAM: BAZ45QTU23
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Interpreter.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
